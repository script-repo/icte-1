specification: ICTE-1
version: '0.2'
status: draft
date: '2026-10-10'
note: Starter vocabulary for ICTE-1. Not an exhaustive dictionary. Not a quotation from ASD-STE100. Local usage conventions, not universal vendor definitions. The word list is not an ontology.
requirement_words:
- word: must
  meaning: A required condition or action.
- word: must not
  meaning: A prohibited condition or action.
- word: should
  meaning: A recommendation. An exception requires a stated reason.
- word: may
  meaning: Permission.
- word: can
  meaning: Capability or possibility, not permission.
avoid_requirement_words:
- word: shall
  reason: Do not use shall.
- word: will
  reason: Do not use will to imply a guarantee unless the behavior is established and its conditions are stated.
avoid_verbs:
  rule: Avoid these operational verbs unless the sentence explains the specific action.
  verbs:
  - handle
  - fix
  - optimize
  - secure
  - enable
domain_notes:
- id: note.cloud.isolation
  domain: cloud
  text: Do not use private, isolated, disconnected, and air-gapped interchangeably. Describe network reachability, administration, and data movement separately.
- id: note.gitops.reservation
  domain: gitops
  text: Reserve GitOps for workflows with declared state and automated reconciliation. Merely storing scripts in Git does not satisfy that convention.
- id: note.devsecops.scan
  domain: devsecops
  text: Do not use a successful scan as proof that a system is secure. State the checks performed, their coverage, and their limitations.
- id: note.gitops.rollback
  domain: gitops
  text: Do not imply that reverting a commit necessarily restores application data or reverses external side effects.
non_equivalences:
- id: ne.ai.model_output
  left: ai.model
  relation: is_not
  right_text: verified fact
  statement: Model output is not verified fact.
  severity: required
- id: ne.ai.retrieval
  left: ai.retrieval
  relation: is_not
  right_text: model training
  statement: Retrieval is not model training.
  severity: required
- id: ne.ai.tool
  left: ai.tool
  relation: is_not
  right_text: permission to execute
  statement: Tool availability is not permission to execute.
  severity: required
- id: ne.ai.agent
  left: ai.agent
  relation: is_not
  right_text: unrestricted authority
  statement: Agent autonomy is not unrestricted authority.
  severity: required
- id: ne.ai.open_weight
  left_text: open-weight
  relation: is_not
  right_text: open-source
  statement: Open-weight is not automatically open-source.
  severity: required
- id: ne.cloud.private_deployment
  left: cloud.environment
  relation: is_not
  right_text: compliant deployment
  statement: Private deployment is not automatically compliant deployment.
  severity: required
proposed_relations:
  note: Proposed modeling statements from ICTE-1 section 9.1. left and right are term ids. These statements need constraints before they constitute a formal ontology.
  statements:
  - id: rel.gitops.reconciles
    left: gitops.controller
    relation: reconciles
    right: gitops.managed_resource
  - id: rel.ai.serves
    left: ai.inference_server
    relation: serves
    right: ai.model_version
  - id: rel.ai.invokes
    left: ai.agent
    relation: invokes
    right: ai.tool
  - id: rel.devsecops.constrains
    left: devsecops.policy
    relation: constrains
    right: action.named_action
  - id: rel.platform.has_owner
    left: platform.platform_service
    relation: has_owner
    right: platform.service_owner
